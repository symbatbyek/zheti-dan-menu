<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px;font:500 12px/1.3 var(--font-sans);color:var(--text-secondary)}.sw i{display:block;height:56px;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px oklch(0% 0 0/.06)}.sw b{font-weight:600;color:var(--text-primary)}.lbl{font:500 12px/1.3 var(--font-sans);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--accent)"></i><b>Accent</b>--accent</div><div class="sw"><i style="background:var(--accent-hover)"></i><b>Hover</b>--accent-hover</div><div class="sw"><i style="background:var(--accent-soft)"></i><b>Soft</b>--accent-soft</div><div class="sw"><i style="background:var(--accent-ink)"></i><b>Ink</b>--accent-ink</div><div class="sw"><i style="background:var(--on-accent)"></i><b>On accent</b>--on-accent</div></div></body></html>
