<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px;font:500 12px/1.3 var(--font-sans);color:var(--text-secondary)}.sw i{display:block;height:56px;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px oklch(0% 0 0/.06)}.sw b{font-weight:600;color:var(--text-primary)}.lbl{font:500 12px/1.3 var(--font-sans);color:var(--text-muted)}.sw{width:62px}</style></head><body><div class="row"><div class="sw"><i style="background:var(--paper-0)"></i><b>Paper 0</b>--paper-0</div><div class="sw"><i style="background:var(--paper-50)"></i><b>Paper 50</b>--paper-50</div><div class="sw"><i style="background:var(--paper-100)"></i><b>Paper 100</b>--paper-100</div><div class="sw"><i style="background:var(--paper-200)"></i><b>Paper 200</b>--paper-200</div><div class="sw"><i style="background:var(--paper-300)"></i><b>Paper 300</b>--paper-300</div><div class="sw"><i style="background:var(--ink-400)"></i><b>Ink 400</b>--ink-400</div><div class="sw"><i style="background:var(--ink-500)"></i><b>Ink 500</b>--ink-500</div><div class="sw"><i style="background:var(--ink-700)"></i><b>Ink 700</b>--ink-700</div><div class="sw"><i style="background:var(--ink-900)"></i><b>Ink 900</b>--ink-900</div></div></body></html>
