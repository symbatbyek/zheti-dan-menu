<!-- @dsCard group="Colors" viewport="700x150" name="Status & semantic" subtitle="Open, closed, danger, sold out, switch" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px;font:500 12px/1.3 var(--font-sans);color:var(--text-secondary)}.sw i{display:block;height:56px;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px oklch(0% 0 0/.06)}.sw b{font-weight:600;color:var(--text-primary)}.lbl{font:500 12px/1.3 var(--font-sans);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--status-open)"></i><b>Open</b>--status-open</div><div class="sw"><i style="background:var(--status-open-soft)"></i><b>Open soft</b>--status-open-soft</div><div class="sw"><i style="background:var(--status-closed)"></i><b>Closed</b>--status-closed</div><div class="sw"><i style="background:var(--status-closed-soft)"></i><b>Closed soft</b>--status-closed-soft</div><div class="sw"><i style="background:var(--soldout-bg)"></i><b>Sold-out bg</b>--soldout-bg</div><div class="sw"><i style="background:var(--surface-scrim)"></i><b>Scrim</b>--surface-scrim</div></div></body></html>
