<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px;font:500 12px/1.3 var(--font-sans);color:var(--text-secondary)}.sw i{display:block;height:56px;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px oklch(0% 0 0/.06)}.sw b{font-weight:600;color:var(--text-primary)}.lbl{font:500 12px/1.3 var(--font-sans);color:var(--text-muted)}</style></head><body><div class="row" style="gap:16px;align-items:flex-start"><figure style="margin:0;display:flex;flex-direction:column;gap:6px"><img src="../assets/photos/plov.jpg" alt="" style="width:200px;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius-lg);display:block"><span class="lbl">4:3 card / sheet</span></figure><figure style="margin:0;display:flex;flex-direction:column;gap:6px"><img src="../assets/photos/plov.jpg" alt="" style="width:104px;height:104px;object-fit:cover;border-radius:var(--radius-md);display:block"><span class="lbl">1:1 row</span></figure><figure style="margin:0;display:flex;flex-direction:column;gap:6px"><div style="width:104px;height:104px;border-radius:var(--radius-md);overflow:hidden"><div class="qm-photo-ph"><span class="qm-icon" style="width:24px;height:24px;--qm-icon:url(https://unpkg.com/lucide-static@0.460.0/icons/utensils.svg)"></span></div></div><span class="lbl">No photo yet</span></figure><p class="lbl" style="max-width:220px;margin:0">Real photos: warm, natural light, top-down or 45°, plate fills frame. Cropped to 4:3 in the admin; row cards centre-crop to 1:1.</p></div></body></html>
