<!-- @dsCard group="Spacing" viewport="700x130" name="Motion" subtitle="Ease-out 120 / 200 / 320ms; press = scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px;font:500 12px/1.3 var(--font-sans);color:var(--text-secondary)}.sw i{display:block;height:56px;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px oklch(0% 0 0/.06)}.sw b{font-weight:600;color:var(--text-primary)}.lbl{font:500 12px/1.3 var(--font-sans);color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-family:var(--font-sans)"><div style="background:var(--surface-card);border-radius:var(--radius-md);padding:12px;border:1px solid var(--border-subtle)"><div style="font:600 16px var(--font-sans)">120ms</div><div class="lbl">--dur-fast<br>press, hover</div></div><div style="background:var(--surface-card);border-radius:var(--radius-md);padding:12px;border:1px solid var(--border-subtle)"><div style="font:600 16px var(--font-sans)">200ms</div><div class="lbl">--dur-base<br>toggles, tabs</div></div><div style="background:var(--surface-card);border-radius:var(--radius-md);padding:12px;border:1px solid var(--border-subtle)"><div style="font:600 16px var(--font-sans)">320ms</div><div class="lbl">--dur-slow<br>sheets, scrims</div></div><div style="background:var(--surface-card);border-radius:var(--radius-md);padding:12px;border:1px solid var(--border-subtle)"><div style="font:600 16px var(--font-sans)">.22,.8,.24,1</div><div class="lbl">--ease-out<br>default curve</div></div></div></body></html>
