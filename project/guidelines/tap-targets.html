<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px;font:500 12px/1.3 var(--font-sans);color:var(--text-secondary)}.sw i{display:block;height:56px;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px oklch(0% 0 0/.06)}.sw b{font-weight:600;color:var(--text-primary)}.lbl{font:500 12px/1.3 var(--font-sans);color:var(--text-muted)}</style></head><body><div class="row" style="align-items:flex-end;gap:24px"><div style="display:flex;flex-direction:column;gap:6px"><i style="display:block;width:105.6px;height:44px;border-radius:var(--radius-md);background:var(--accent-soft);outline:1px dashed var(--accent)"></i><span class="lbl"><b style="color:var(--text-primary)">44px</b> --tap-min<br>Guest buttons, tabs, icons</span></div><div style="display:flex;flex-direction:column;gap:6px"><i style="display:block;width:124.8px;height:52px;border-radius:var(--radius-md);background:var(--accent-soft);outline:1px dashed var(--accent)"></i><span class="lbl"><b style="color:var(--text-primary)">52px</b> --tap-lg<br>Admin fields, primary actions</span></div><div style="display:flex;flex-direction:column;gap:6px"><i style="display:block;width:134.4px;height:56px;border-radius:var(--radius-md);background:var(--accent-soft);outline:1px dashed var(--accent)"></i><span class="lbl"><b style="color:var(--text-primary)">56px</b> FAB<br>Add dish</span></div></div></body></html>
