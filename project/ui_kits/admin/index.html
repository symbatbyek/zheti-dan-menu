<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner admin · QR Menu</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../guest-menu/data.js"></script>
<style>
body{background:var(--paper-200);min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}
.kit-bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:520px}
.kit-bar button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface-card);font:500 13px var(--font-sans);color:var(--text-secondary);cursor:pointer}
.kit-bar button[aria-pressed="true"]{background:var(--ink-900);border-color:var(--ink-900);color:var(--paper-50)}
.kit-phone,.phone{position:relative;width:375px;height:812px;border-radius:36px;overflow:hidden;background:var(--surface-page);box-shadow:0 0 0 8px var(--ink-900),0 24px 60px oklch(21% .012 60/.3);flex:none;display:flex;flex-direction:column}
</style></head>
<body><div id="root"></div>
<script type="text/babel" src="AdminLogin.jsx"></script>
<script type="text/babel" src="AdminMenu.jsx"></script>
<script type="text/babel" src="DishEdit.jsx"></script>
<script type="text/babel" src="AdminCategories.jsx"></script>
<script type="text/babel" src="AdminProfile.jsx"></script>
<script type="text/babel" src="AdminQr.jsx"></script>
<script type="text/babel" src="AdminSettings.jsx"></script>
<script type="text/babel" src="OwnerApp.jsx"></script>
<script type="text/babel">
function KitApp() {
  const [s, setS] = React.useState('menu');
  return (<>
    <div className="kit-bar">{[['login','Login'],['menu','Menu list'],['edit','Edit dish'],['cats','Categories'],['qr','QR codes'],['settings','Settings'],['profile','Café profile']].map(([v,l]) => <button key={v} aria-pressed={v === s} onClick={() => setS(v)}>{l}</button>)}</div>
    <OwnerApp key={s} start={s} />
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<KitApp />);
</script></body></html>
